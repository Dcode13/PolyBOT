[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "polybot-local"
version = "0.1.0"
description = "Non-crypto Polymarket scanner and conservative automated execution"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["polymarket-client==0.12.0"]
telegram = ["matplotlib>=3.10,<4"]

[project.scripts]
polybot = "polybot.__main__:main"

[tool.setuptools.packages.find]
include = ["polybot*"]
